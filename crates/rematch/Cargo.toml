[package]
name = "rematch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rematch"
path = "src/main.rs"

[features]
default = ["lake"]
# The lake (ADR 001 L2): `rematch lake export|import|rebuild|doctor` with arrow/parquet.
# Without it the binary builds without arrow and those commands report the missing feature.
lake = ["dep:rematch-lake"]

[dependencies]
rematch-core = { path = "../rematch-core" }
rematch-lake = { path = "../rematch-lake", optional = true }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
libc.workspace = true
tempfile.workspace = true
serde_yaml.workspace = true
regex.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
