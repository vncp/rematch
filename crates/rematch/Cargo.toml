[package]
name = "rematch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rematch"
path = "src/main.rs"

[features]
default = ["lake"]
# The lake (ADR 001 L2): `rematch lake export|import|rebuild|doctor` with arrow/parquet.
# Without it the binary builds without arrow and those commands report the missing feature.
lake = ["dep:rematch-lake"]

[dependencies]
rematch-core = { path = "../rematch-core" }
rematch-lake = { path = "../rematch-lake", optional = true }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
libc.workspace = true
tempfile.workspace = true
serde_yaml.workspace = true
regex.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
