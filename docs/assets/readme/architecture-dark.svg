<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="title desc">
<title id="title">rematch architecture</title>
<desc id="desc">omp emits extension events and discovers scoped skill and agent views. The binary owns the ledger, library, lint, adoption actions and bounded probes, and calls omp for editor and solver work. Personal AGENTS.md changes require approval and preserve user text. Canonical state lives under ~/.rematch; sharing to teams or forks is optional.</desc>
