<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="title desc">
<title id="title">Entry statuses</title>
<desc id="desc">Draft becomes provisional when you give it a task or accept it unverified. Provisional becomes kept after sustained relevant clean use or engine-recorded comparative support, not from catalog presence alone. Repeated recurrence or harm retires an entry; inactivity may make it dormant. Kept entries remain reversible. Stale entries need a new canary; pinned entries remain user-owned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0.5" y="0.5" width="1099" height="429" rx="16" fill="#f7f7f7" stroke="#e5e5e5"/>
<rect x="40" y="150" width="170" height="64" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="125" y="178" font-size="17" font-weight="600" text-anchor="middle" fill="#171717">draft</text>
<text x="125" y="198" font-size="12" text-anchor="middle" fill="#666666">visible, never loaded</text>
<rect x="300" y="150" width="170" height="64" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="385" y="178" font-size="17" font-weight="600" text-anchor="middle" fill="#171717">provisional</text>
<text x="385" y="198" font-size="12" text-anchor="middle" fill="#666666">scoped trial</text>
<rect x="580" y="150" width="170" height="64" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="665" y="178" font-size="17" font-weight="600" text-anchor="middle" fill="#171717">kept</text>
<text x="665" y="198" font-size="12" text-anchor="middle" fill="#666666">retained with evidence</text>
<rect x="860" y="150" width="170" height="64" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="945" y="178" font-size="17" font-weight="600" text-anchor="middle" fill="#171717">stale</text>
<text x="945" y="198" font-size="12" text-anchor="middle" fill="#666666">excluded; evidence drifted</text>
<rect x="130" y="308" width="170" height="64" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="215" y="336" font-size="17" font-weight="600" text-anchor="middle" fill="#171717">dormant</text>
<text x="215" y="356" font-size="12" text-anchor="middle" fill="#666666">excluded, kept on disk</text>
<rect x="720" y="308" width="170" height="64" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="805" y="336" font-size="17" font-weight="600" text-anchor="middle" fill="#171717">retired</text>
<text x="805" y="356" font-size="12" text-anchor="middle" fill="#666666">archived with evidence</text>
<path d="M210 182 L298 182" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="255" y="140" font-size="12" text-anchor="middle" fill="#666666">task run, or --unverified</text>
<path d="M470 182 L578 182" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<text x="524" y="124" font-size="12" text-anchor="middle" fill="#4338ca">sustained relevant clean use</text>
<text x="524" y="141" font-size="12" text-anchor="middle" fill="#666666">or bounded comparative support</text>
<path d="M750 182 L858 182" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="804" y="140" font-size="12" text-anchor="middle" fill="#666666">as_of · family · fork commit changed</text>
<path d="M945 150 C945 70 360 70 360 148" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="652" y="84" font-size="12" text-anchor="middle" fill="#666666">new canary → provisional, counters from zero</text>
<path d="M340 214 L270 308" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="296" y="262" font-size="12" text-anchor="end" fill="#666666">12 matched, no decision · 30 d, &lt; 3 matches</text>
<path d="M300 335 C390 335 400 300 400 216" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="300" font-size="12" text-anchor="start" fill="#666666">predicate hits again</text>
<path d="M470 200 C540 200 540 350 718 350" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="372" font-size="12" text-anchor="middle" fill="#666666">2 recurrences · 2 harm</text>
<path d="M700 214 L775 308" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="792" y="250" font-size="12" text-anchor="start" fill="#666666">2 harm in 30 d · disable</text>
<path d="M980 214 C980 345 950 345 892 345" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="992" y="292" font-size="12" text-anchor="start" fill="#666666">or retired</text>
<text x="805" y="395" font-size="12" text-anchor="middle" fill="#767676">never leaves</text>
<text x="40" y="408" font-size="13" font-weight="600" fill="#171717">pinned</text>
<text x="96" y="408" font-size="12" text-anchor="start" fill="#666666">a flag you set and unset; automatic transitions never touch a pinned entry</text>
</g></svg>
