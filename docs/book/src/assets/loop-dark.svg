<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="title desc">
<title id="title">The rematch loop</title>
<desc id="desc">In the session the extension traces every event, flags sessions that carried a redirect, a tool-error cluster or a takeover, loads provisional entries whose predicate matches, and runs approved hooks. Between sessions the binary classifies the redirect, triages the failure, runs one editor, lints, stages the entry as provisional, counts later matched sessions and decides keep, retire or dormant. An evidence boundary separates them: no proposal without a trace, no model call inside a session. You approve scripts and hooks with one tap, mark redirects, or turn it off.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a9a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6360f0"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0.5" y="0.5" width="1099" height="639" rx="16" fill="#0a0a0a" stroke="#262626"/>
<rect x="30" y="56" width="420" height="420" rx="12" fill="#121212" stroke="#262626"/>
<text x="52" y="92" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#9a9a9a">IN THE SESSION</text>
<text x="52" y="115" font-size="13" fill="#6b6b6b">extension · index.ts · no model calls</text>
<line x1="52" y1="134" x2="428" y2="134" stroke="#262626"/>
<text x="52" y="169.86" font-size="16" font-weight="600" fill="#f2f2f2">trace</text>
<text x="52" y="188.86" font-size="12.5" fill="#9a9a9a">every input, tool result, turn, model change → traces/</text>
<line x1="52" y1="215.5" x2="428" y2="215.5" stroke="#262626"/>
<text x="52" y="251.36" font-size="16" font-weight="600" fill="#f2f2f2">flag</text>
<text x="52" y="270.36" font-size="12.5" fill="#9a9a9a">redirect, tool-error cluster, takeover, /rematch mark → pending/</text>
<line x1="52" y1="297.0" x2="428" y2="297.0" stroke="#262626"/>
<text x="52" y="332.86" font-size="16" font-weight="600" fill="#f2f2f2">load</text>
<text x="52" y="351.86" font-size="12.5" fill="#9a9a9a">staging/&lt;branch&gt;/ joins the skill paths on predicate match</text>
<line x1="52" y1="378.5" x2="428" y2="378.5" stroke="#262626"/>
<text x="52" y="414.36" font-size="16" font-weight="600" fill="#f2f2f2">guard</text>
<text x="52" y="433.36" font-size="12.5" fill="#9a9a9a">approved hooks run on tool_call; block with the rule's message</text>
<rect x="650" y="56" width="420" height="420" rx="12" fill="#121212" stroke="#262626"/>
<text x="672" y="92" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#9a9a9a">BETWEEN SESSIONS</text>
<text x="672" y="115" font-size="13" fill="#6b6b6b">rematch · Rust · one static binary</text>
<line x1="672" y1="134" x2="1048" y2="134" stroke="#262626"/>
<text x="672" y="157.90666666666667" font-size="16" font-weight="600" fill="#f2f2f2">classify</text>
<text x="672" y="176.90666666666667" font-size="12.5" fill="#9a9a9a">correction · preference · scope · none, batched, one call</text>
<line x1="672" y1="188.33333333333334" x2="1048" y2="188.33333333333334" stroke="#262626"/>
<text x="672" y="212.24" font-size="16" font-weight="600" fill="#f2f2f2">triage</text>
<text x="672" y="231.24" font-size="12.5" fill="#9a9a9a">process vs content; domain vs invariant editor; the moment</text>
<line x1="672" y1="242.66666666666669" x2="1048" y2="242.66666666666669" stroke="#262626"/>
<text x="672" y="266.5733333333334" font-size="16" font-weight="600" fill="#f2f2f2">propose</text>
<text x="672" y="285.5733333333334" font-size="12.5" fill="#9a9a9a">one editor, --no-tools, inputs in the prompt; KEEP_BASE valid</text>
<line x1="672" y1="297.0" x2="1048" y2="297.0" stroke="#262626"/>
<text x="672" y="320.90666666666664" font-size="16" font-weight="600" fill="#f2f2f2">lint</text>
<text x="672" y="339.90666666666664" font-size="12.5" fill="#9a9a9a">no ids, URLs, network, destructive git; scripts 0644; 8 KB</text>
<line x1="672" y1="351.3333333333333" x2="1048" y2="351.3333333333333" stroke="#262626"/>
<text x="672" y="375.24" font-size="16" font-weight="600" fill="#f2f2f2">stage</text>
<text x="672" y="394.24" font-size="12.5" fill="#9a9a9a">provisional, with its trigger predicate and manifest</text>
<line x1="672" y1="405.6666666666667" x2="1048" y2="405.6666666666667" stroke="#262626"/>
<text x="672" y="429.5733333333334" font-size="16" font-weight="600" fill="#f2f2f2">count · decide</text>
<text x="672" y="448.5733333333334" font-size="12.5" fill="#9a9a9a">recurrence, harm, matched → kept · retired · dormant</text>
<text x="240" y="506" font-size="13" text-anchor="middle" fill="#6b6b6b">runs the model's session · writes only the trace</text>
<text x="860" y="506" font-size="13" text-anchor="middle" fill="#6b6b6b">spawned detached at session start · ≤ 3 model calls per reflection</text>
<line x1="550" y1="50" x2="550" y2="486" stroke="#6360f0" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="458" y="24" width="184" height="24" rx="12" fill="#0a0a0a"/>
<text x="550" y="41" font-size="12" font-weight="600" letter-spacing="0.12em" text-anchor="middle" fill="#a9abff">EVIDENCE BOUNDARY</text>
<text x="550" y="506" font-size="13" text-anchor="middle" fill="#a9abff">no proposal without a trace</text>
<rect x="462" y="160" width="176" height="38" fill="#0a0a0a"/>
<text x="550" y="176" font-size="13" text-anchor="middle" fill="#9a9a9a">traces, pending flags,</text>
<text x="550" y="193" font-size="13" text-anchor="middle" fill="#9a9a9a">marks</text>
<line x1="458" y1="210" x2="640" y2="210" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="642" y1="300" x2="460" y2="300" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="458" y="312" width="184" height="38" fill="#0a0a0a"/>
<text x="550" y="328" font-size="13" text-anchor="middle" fill="#9a9a9a">staging dirs, hook modules,</text>
<text x="550" y="345" font-size="13" text-anchor="middle" fill="#9a9a9a">the digest</text>
<rect x="400" y="546" width="300" height="66" rx="12" fill="#121212" stroke="#9a9a9a"/>
<text x="550" y="574" font-size="17" font-weight="600" text-anchor="middle" fill="#f2f2f2">You</text>
<text x="550" y="596" font-size="13" text-anchor="middle" fill="#9a9a9a">one-tap approvals · /rematch mark · /rematch off</text>
<path d="M370 478 C370 540 384 579 394 579" fill="none" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="552" font-size="13" text-anchor="end" fill="#9a9a9a">digest</text>
<path d="M706 579 C716 579 730 540 730 482" fill="none" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="740" y="552" font-size="13" fill="#9a9a9a">approve · decline · disable</text>
</g></svg>
