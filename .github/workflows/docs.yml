name: docs

# Builds the mdBook under docs/book and publishes it to https://vncp.github.io/rematch.
# Pull requests build only; pushes to main build and deploy.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "improver/lint.toml"
      - "improver/domain_rules.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "improver/lint.toml"
      - "improver/domain_rules.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push supersedes a pull-request build, never a deploy in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook ${{ env.MDBOOK_VERSION }} (official release tarball)
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: mdbook --version
      - name: Build
        run: mdbook build docs/book
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
