name: docs

# Builds the Starlight site under docs/site and publishes it to https://vncp.github.io/rematch.
# Pull requests build only; pushes to main build and deploy. The generated pages (CLI reference,
# included DESIGN/research sections) are committed: run `bun run gen` in docs/site after changing them.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "improver/lint.toml"
      - "improver/domain_rules.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "improver/lint.toml"
      - "improver/domain_rules.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push supersedes a pull-request build, never a deploy in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build (fails on any broken internal link)
        run: bun run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
